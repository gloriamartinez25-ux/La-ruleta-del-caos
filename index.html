<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Ruleta del Caos - ChicaOhyeah</title>
    <style>
        :root {
            --bg-color: #0b0914;
            --panel-bg: #151124;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-lime: #39ff14;
            --neon-yellow: #fffe00;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }
        header { text-align: center; margin-bottom: 15px; }
        h1 {
            font-size: 1.6rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 243, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle { font-size: 0.85rem; color: #a5b4fc; margin-top: 3px; }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            gap: 15px;
        }
        
        /* Ruleta */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--neon-pink);
            z-index: 20;
            filter: drop-shadow(0 0 8px var(--neon-pink));
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px var(--neon-pink), inset 0 0 15px rgba(255, 255, 255, 0.3);
            border: 4px solid var(--neon-cyan);
        }
        
        /* Botón Gigante de Giro */
        .spin-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.4rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--neon-pink), #ff5e00);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px var(--neon-pink);
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 1px;
        }
        .spin-btn:active { transform: scale(0.96); box-shadow: 0 0 10px var(--neon-pink); }

        /* Panel de gestión */
        .panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .panel h2 { font-size: 1.1rem; color: var(--neon-yellow); margin-bottom: 10px; text-align: center; }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4b5563;
            background-color: #1f1a3a;
            color: white;
            font-size: 0.95rem;
        }
        .add-btn {
            padding: 0 16px;
            background-color: var(--neon-lime);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .items-list {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Modales */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: linear-gradient(145deg, #1f1a3a, #110c22);
            border: 3px solid var(--neon-lime);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px var(--neon-lime);
            animation: popIn 0.3s ease;
        }
        .modal-content h3 { color: var(--neon-yellow); font-size: 1.3rem; margin-bottom: 5px; text-transform: uppercase; }
        .modal-content p { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        
        .custom-box {
            background: rgba(0,0,0,0.5);
            border: 2px dashed var(--neon-cyan);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .box-category {
            font-size: 0.85rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .box-question { 
            color: var(--neon-cyan); 
            font-size: 1.1rem; 
            margin-bottom: 10px; 
            line-height: 1.4; 
            font-weight: bold;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .option-btn {
            background: #2a224a;
            color: white;
            border: 1px solid var(--neon-cyan);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-btn.correct { background: #15803d !important; border-color: var(--neon-lime) !important; color: white; }
        .option-btn.wrong { background: #b91c1c !important; border-color: #ef4444 !important; color: white; }

        .trivial-answer { 
            color: var(--neon-lime); 
            font-size: 0.95rem; 
            font-weight: bold; 
            display: none; 
            margin-top: 8px; 
        }
        
        .btn-reveal {
            background: var(--neon-yellow);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
        }

        .close-modal {
            background: var(--neon-pink);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-pink);
            width: 100%;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>La Ruleta del Caos</h1>
        <div class="subtitle">ChicaOhyeah TikTok Live</div>
    </header>

    <div class="main-container">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>

        <button class="spin-btn" id="spinButton">¡Girar Ruleta!</button>

        <div class="panel">
            <h2>Personalizar Casillas</h2>
            <div class="input-group">
                <input type="text" id="newItemText" placeholder="Añade nuevo reto u opción...">
                <button class="add-btn" id="addBtn">Añadir</button>
            </div>
            <div class="items-list" id="itemsList"></div>
        </div>
    </div>

    <!-- Modal Unificado de Resultados -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h3 id="modalTitle">¡Resultado del Caos!</h3>
            <p id="resultText">Premio</p>

            <div class="custom-box" id="customBox" style="display: none;">
                <div class="box-category" id="boxCategory">CATEGORÍA</div>
                <div class="box-question" id="boxQuestion">Detalle del reto</div>
                <div class="options-grid" id="optionsGrid"></div>
                <button class="btn-reveal" id="revealBtn" style="display:none;">Ver Respuesta Correcta</button>
                <div class="trivial-answer" id="trivialAnswer">Respuesta correcta</div>
            </div>

            <button class="close-modal" id="closeModal">¡Entendido!</button>
        </div>
    </div>

    <script>
        const defaultItems = [
            "🧠 TRIVIAL", "🔮 EL PÉNDULO", "🎁 REGALOS VIP", 
            "🤫 INCÓMODA", "🃏 EL JOKER", "🧠 TRIVIAL", 
            "🔮 EL PÉNDULO", "🎁 REGALOS VIP"
        ];

        const preguntasTrivial = [
            { cat: "🎵 Música", q: "¿Quién canta la famosa canción 'Despacito'?", opts: ["Bad Bunny", "Luis Fonsi", "Daddy Yankee", "Rauw Alejandro"], correct: 1 },
            { cat: "🎵 Música", q: "¿De qué país es la cantante Rosalía?", opts: ["México", "Argentina", "España", "Colombia"], correct: 2 },
            { cat: "🎬 Cine & TV", q: "¿Cómo se llama el ogro verde de la película?", opts: ["Shrek", "Fiona", "Asno", "Lord Farquaad"], correct: 0 },
            { cat: "📱 Redes Social", q: "¿Qué red social tenía el icono de un pajarito azul?", opts: ["TikTok", "Instagram", "Twitter (X)", "Facebook"], correct: 2 },
            { cat: "🧠 Curiosidades", q: "¿Cuántos corazones tiene un pulpo?", opts: ["1 corazón", "2 corazones", "3 corazones", "4 corazones"], correct: 2 },
            { cat: "🍕 Gastronomía", q: "¿Cuál es el ingrediente principal del guacamole?", opts: ["Tomate", "Aguacate", "Pimiento", "Cebolla"], correct: 1 }
        ];

        const preguntasIncomodas = [
            "¿Cuál ha sido tu mayor ridículo en público?",
            "Si pudieras borrar un mensaje que mandaste por error, ¿a quién iba?",
            "¿Qué mentira piadosa dijiste la semana pasada?",
            "¿Cuál es el capricho más absurdo en el que te has gastado dinero?",
            "Si tu historial fuera público, ¿qué porcentaje de vergüenza tendrías?"
        ];

        const poderesJoker = [
            "¡Poder Absoluto! Elige a alguien del chat para que cumpla el próximo castigo.",
            "¡Doble Giro! Vuelve a girar la ruleta inmediatamente.",
            "¡El Chat Manda! Los espectadores deciden tu próximo reto por comentarios.",
            "¡Intercambio! Pásale el reto al último que envió un regalo."
        ];

        const respuestasPendulo = [
            "🔮 El Péndulo dice: ¡DEFINITIVAMENTE SÍ!",
            "🔮 El Péndulo dice: ¡NI DE COÑA (NO)!",
            "🔮 El Péndulo dice: El destino no está claro... Pregunta de nuevo.",
            "🔮 El Péndulo dice: Todo apunta a que SÍ con mucha suerte.",
            "🔮 El Péndulo dice: Hay malas energías... La respuesta es NO."
        ];

        const dinámicasRegalos = [
            "🎁 ¡RETO DE REGALOS! Si el chat envía 10 Rosas o 1 Regalo en 60s, ¡cumplo un reto extremo!",
            "🎁 ¡COFRE DEL TESORO! La persona que envíe el próximo regalo elige qué reto tengo que hacer.",
            "🎁 ¡SALUDOS VIP! Mando saludos especiales y sigo en directo a quien envíe el próximo regalo."
        ];

        let items = JSON.parse(localStorage.getItem('ruleta_caos_items')) || defaultItems;

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinButton = document.getElementById('spinButton');
        const itemsList = document.getElementById('itemsList');
        const newItemText = document.getElementById('newItemText');
        const addBtn = document.getElementById('addBtn');
        const resultModal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const modalTitle = document.getElementById('modalTitle');
        
        const customBox = document.getElementById('customBox');
        const boxCategory = document.getElementById('boxCategory');
        const boxQuestion = document.getElementById('boxQuestion');
        const optionsGrid = document.getElementById('optionsGrid');
        const trivialAnswer = document.getElementById('trivialAnswer');
        const revealBtn = document.getElementById('revealBtn');
        const closeModal = document.getElementById('closeModal');

        let startAngle = 0;
        let arc = Math.PI / (items.length / 2);
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        const colors = ['#ff007f', '#00f3ff', '#39ff14', '#fffe00', '#9333ea', '#ff5e00', '#3b82f6', '#ec4899'];

        function drawWheel() {
            if (!canvas.getContext) return;
            arc = Math.PI / (items.length / 2);
            ctx.clearRect(0, 0, 400, 400);

            let outsideRadius = 185;
            let textRadius = 130;
            let insideRadius = 30;

            for(let i = 0; i < items.length; i++) {
                let angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.arc(200, 200, outsideRadius, angle, angle + arc, false);
                ctx.arc(200, 200, insideRadius, angle + arc, angle, true);
                ctx.stroke();
                ctx.fill();

                ctx.save();
                ctx.shadowOffsetX = -1;
                ctx.shadowOffsetY = -1;
                ctx.shadowBlur = 2;
                ctx.shadowColor = "rgb(0,0,0)";
                ctx.fillStyle = "#000000";
                ctx.translate(200 + Math.cos(angle + arc / 2) * textRadius, 
                              200 + Math.sin(angle + arc / 2) * textRadius);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                let text = items[i];
                let maxLength = 16;
                if(text.length > maxLength) text = text.substring(0, maxLength) + '...';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(200, 200, insideRadius, 0, 2 * Math.PI, false);
            ctx.fillStyle = '#151124';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#00f3ff';
            ctx.stroke();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            ctx.save();
            let winningText = items[index];
            let textUpper = winningText.toUpperCase();

            customBox.style.display = "none";
            optionsGrid.innerHTML = '';
            revealBtn.style.display = "none";
            trivialAnswer.style.display = "none";

            if (textUpper.includes("TRIVIAL") || winningText.includes("🧠")) {
                modalTitle.textContent = "🧠 ¡PREGUNTA TRIVIAL!";
                resultText.textContent = "¡Responde en el chat!";
                let randomQ = preguntasTrivial[Math.floor(Math.random() * preguntasTrivial.length)];
                boxCategory.textContent = randomQ.cat;
                boxQuestion.textContent = randomQ.q;
                trivialAnswer.textContent = "Correcta: " + randomQ.opts[randomQ.correct];
                revealBtn.style.display = "block";

                const letters = ["A", "B", "C", "D"];
                randomQ.opts.forEach((optText, optIdx) => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = `${letters[optIdx]}) ${optText}`;
                    btn.onclick = function() {
                        let allBtns = optionsGrid.querySelectorAll('.option-btn');
                        allBtns.forEach(b => b.disabled = true);
                        if(optIdx === randomQ.correct) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('wrong');
                            allBtns[randomQ.correct].classList.add('correct');
                        }
                    };
                    optionsGrid.appendChild(btn);
                });
                customBox.style.display = "block";

            } else if (textUpper.includes("INCÓMODA") || textUpper.includes("INCOMODA") || winningText.includes("🤫")) {
                modalTitle.textContent = "🤫 ¡ZONA DE SALSEO!";
                resultText.textContent = "¡Confesión obligatoria!";
                boxCategory.textContent = "🔥 PREGUNTA INCÓMODA";
                boxQuestion.textContent = preguntasIncomodas[Math.floor(Math.random() * preguntasIncomodas.length)];
                customBox.style.display = "block";

            } else if (textUpper.includes("JOKER") || winningText.includes("🃏")) {
                modalTitle.textContent = "🃏 ¡HA SALIDO EL JOKER!";
                resultText.textContent = "¡Poder oculto activado!";
                boxCategory.textContent = "⚡ PODER COMODÍN";
                boxQuestion.textContent = poderesJoker[Math.floor(Math.random() * poderesJoker.length)];
                customBox.style.display = "block";

            } else if (textUpper.includes("PÉNDULO") || textUpper.includes("PENDULO") || winningText.includes("🔮")) {
                modalTitle.textContent = "🔮 ¡PREGÚNTALE AL PÉNDULO!";
                resultText.textContent = "¡Haz tu pregunta en el chat!";
                boxCategory.textContent = "✨ PREDICCIÓN MÍSTICA";
                boxQuestion.textContent = respuestasPendulo[Math.floor(Math.random() * respuestasPendulo.length)];
                customBox.style.display = "block";

            } else if (textUpper.includes("REGALOS") || winningText.includes("🎁")) {
                modalTitle.textContent = "🎁 ¡EVENTO DE REGALOS VIP!";
                resultText.textContent = "¡Momento especial para el chat!";
                boxCategory.textContent = "👑 DINÁMICA DE REGALOS";
                boxQuestion.textContent = dinámicasRegalos[Math.floor(Math.random() * dinámicasRegalos.length)];
                customBox.style.display = "block";

            } else {
                modalTitle.textContent = "¡Resultado del Caos!";
                resultText.textContent = winningText;
            }

            resultModal.classList.add('show');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            
            isSpinning = false;
            spinButton.disabled = false;
            ctx.restore();
        }

        function easeOut(t, b, c, d) {
            let ts = (t/=d)*t;
            let tc = ts*t;
            return b+c*(tc + -3*ts + 3*t);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinButton.disabled = true;
            spinAngleStart = Math.random() * 10 + 20;
            spinTime = 0;
            spinTimeTotal = Math.random() * 2000 + 3000;
            rotateWheel();
        }

        function updateList() {
            itemsList.innerHTML = '';
            items.forEach((item, index) => {
                let row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `<span>${item}</span> <button class="delete-btn" onclick="removeItem(${index})">X</button>`;
                itemsList.appendChild(row);
            });
            localStorage.setItem('ruleta_caos_items', JSON.stringify(items));
            drawWheel();
        }

        window.removeItem = function(index) {
            if(items.length <= 2) {
                alert("¡Necesitas al menos 2 opciones!");
                return;
            }
            items.splice(index, 1);
            updateList();
        }

        addBtn.addEventListener('click', () => {
            let val = newItemText.value.trim();
            if(val) {
                items.push(val);
                newItemText.value = '';
                updateList();
            }
        });

        revealBtn.addEventListener('click', () => {
            trivialAnswer.style.display = "block";
            revealBtn.style.display = "none";
        });

        spinButton.addEventListener('click', spin);
        closeModal.addEventListener('click', () => resultModal.classList.remove('show'));

        drawWheel();
        updateList();
    </script>
</body>
</html>
