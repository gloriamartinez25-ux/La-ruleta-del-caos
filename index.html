<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Ruleta del Caos - ChicaOhyeah</title>
    <style>
        :root {
            --bg-color: #0b0914;
            --panel-bg: #151124;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-lime: #39ff14;
            --neon-yellow: #fffe00;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }
        header { text-align: center; margin-bottom: 15px; }
        h1 {
            font-size: 1.6rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 243, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle { font-size: 0.85rem; color: #a5b4fc; margin-top: 3px; }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            gap: 15px;
        }
        
        /* Ruleta */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--neon-pink);
            z-index: 20;
            filter: drop-shadow(0 0 8px var(--neon-pink));
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px var(--neon-pink), inset 0 0 15px rgba(255, 255, 255, 0.3);
            border: 4px solid var(--neon-cyan);
        }
        
        /* Botón Gigante de Giro */
        .spin-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.4rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--neon-pink), #ff5e00);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px var(--neon-pink);
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 1px;
        }
        .spin-btn:active { transform: scale(0.96); box-shadow: 0 0 10px var(--neon-pink); }

        /* Panel de gestión / premios */
        .panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .panel h2 { font-size: 1.1rem; color: var(--neon-yellow); margin-bottom: 10px; text-align: center; }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4b5563;
            background-color: #1f1a3a;
            color: white;
            font-size: 0.95rem;
        }
        .add-btn {
            padding: 0 16px;
            background-color: var(--neon-lime);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .items-list {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Modales */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: linear-gradient(145deg, #1f1a3a, #110c22);
            border: 3px solid var(--neon-lime);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 0 30px var(--neon-lime);
            animation: popIn 0.3s ease;
        }
        .modal-content h3 { color: var(--neon-yellow); font-size: 1.3rem; margin-bottom: 10px; text-transform: uppercase; }
        .modal-content p { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; color: #fff; }
        
        .trivial-box {
            background: rgba(0,0,0,0.4);
            border: 2px dashed var(--neon-cyan);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .trivial-question { color: var(--neon-cyan); font-size: 1.1rem; margin-bottom: 10px; }
        .trivial-answer { color: var(--neon-lime); font-size: 1rem; font-weight: normal; display: none; margin-top: 8px; }
        
        .btn-reveal {
            background: var(--neon-yellow);
            color: #000;
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .close-modal {
            background: var(--neon-pink);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-pink);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>La Ruleta del Caos</h1>
        <div class="subtitle">ChicaOhyeah TikTok Live</div>
    </header>

    <div class="main-container">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>

        <button class="spin-btn" id="spinButton">¡Girar Ruleta!</button>

        <div class="panel">
            <h2>Personalizar Casillas</h2>
            <div class="input-group">
                <input type="text" id="newItemText" placeholder="Añade nuevo reto o opción...">
                <button class="add-btn" id="addBtn">Añadir</button>
            </div>
            <div class="items-list" id="itemsList"></div>
        </div>
    </div>

    <!-- Modal de Resultado Normal / Trivial -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h3 id="modalTitle">¡Resultado del Caos!</h3>
            <p id="resultText">Premio</p>

            <div class="trivial-box" id="trivialBox" style="display: none;">
                <div class="trivial-question" id="trivialQuestion">¿Pregunta?</div>
                <button class="btn-reveal" id="revealBtn">Ver Respuesta</button>
                <div class="trivial-answer" id="trivialAnswer">Respuesta correcta</div>
            </div>

            <button class="close-modal" id="closeModal">¡Entendido!</button>
        </div>
    </div>

    <script>
        const defaultItems = [
            "🧠 TRIVIAL", "Dueto improvisado", "Imita a un famoso", 
            "Puntos dobles", "🧠 TRIVIAL", "Baila la macarena", 
            "Pregunta incómoda", "Gira de nuevo"
        ];

        // Banco de preguntas de Trivial para el directo
        const preguntasTrivial = [
            { q: "¿Cuál es el planeta más grande del sistema solar?", a: "Júpiter" },
            { q: "¿En qué año llegó el ser humano a la Luna?", a: "1969" },
            { q: "¿Cuál es el océano más grande de la Tierra?", a: "Océano Pacífico" },
            { q: "¿Cuántos huesos tiene el cuerpo humano adulto?", a: "206 huesos" },
            { q: "¿Qué instrumento musical tiene teclas, martillos y cuerdas?", a: "El Piano" },
            { q: "¿Cuál es el país más grande del mundo por superficie?", a: "Rusia" },
            { q: "¿En qué país se inventó la pizza?", a: "Italia" },
            { q: "¿Cuál es el animal terrestre más rápido del mundo?", a: "El guepardo" },
            { q: "¿Qué color resulta de mezclar azul y amarillo?", a: "Verde" },
            { q: "¿Cuántos minutos tiene una hora?", a: "60 minutos" }
        ];

        let items = JSON.parse(localStorage.getItem('ruleta_caos_items')) || defaultItems;

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinButton = document.getElementById('spinButton');
        const itemsList = document.getElementById('itemsList');
        const newItemText = document.getElementById('newItemText');
        const addBtn = document.getElementById('addBtn');
        const resultModal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const modalTitle = document.getElementById('modalTitle');
        const trivialBox = document.getElementById('trivialBox');
        const trivialQuestion = document.getElementById('trivialQuestion');
        const trivialAnswer = document.getElementById('trivialAnswer');
        const revealBtn = document.getElementById('revealBtn');
        const closeModal = document.getElementById('closeModal');

        let startAngle = 0;
        let arc = Math.PI / (items.length / 2);
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        const colors = ['#ff007f', '#00f3ff', '#39ff14', '#fffe00', '#9333ea', '#ff5e00', '#3b82f6', '#ec4899'];

        function drawWheel() {
            if (!canvas.getContext) return;
            arc = Math.PI / (items.length / 2);
            ctx.clearRect(0, 0, 400, 400);

            let outsideRadius = 185;
            let textRadius = 130;
            let insideRadius = 30;

            for(let i = 0; i < items.length; i++) {
                let angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.arc(200, 200, outsideRadius, angle, angle + arc, false);
                ctx.arc(200, 200, insideRadius, angle + arc, angle, true);
                ctx.stroke();
                ctx.fill();

                ctx.save();
                ctx.shadowOffsetX = -1;
                ctx.shadowOffsetY = -1;
                ctx.shadowBlur = 2;
                ctx.shadowColor = "rgb(0,0,0)";
                ctx.fillStyle = "#000000";
                ctx.translate(200 + Math.cos(angle + arc / 2) * textRadius, 
                              200 + Math.sin(angle + arc / 2) * textRadius);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                let text = items[i];
                let maxLength = 16;
                if(text.length > maxLength) text = text.substring(0, maxLength) + '...';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(200, 200, insideRadius, 0, 2 * Math.PI, false);
            ctx.fillStyle = '#151124';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#00f3ff';
            ctx.stroke();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            ctx.save();
            let winningText = items[index];

            if (winningText.toLowerCase().includes("trivial")) {
                modalTitle.textContent = "🧠 ¡RETO TRIVIAL!";
                resultText.textContent = "¡Pregunta para el chat!";
                
                // Seleccionar pregunta aleatoria
                let randomQ = preguntasTrivial[Math.floor(Math.random() * preguntasTrivial.length)];
                trivialQuestion.textContent = randomQ.q;
                trivialAnswer.textContent = "Respuesta: " + randomQ.a;
                trivialAnswer.style.display = "none";
                revealBtn.style.display = "inline-block";
                trivialBox.style.display = "block";
            } else {
                modalTitle.textContent = "¡Resultado del Caos!";
                resultText.textContent = winningText;
                trivialBox.style.display = "none";
            }

            resultModal.classList.add('show');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            
            isSpinning = false;
            spinButton.disabled = false;
            ctx.restore();
        }

        function easeOut(t, b, c, d) {
            let ts = (t/=d)*t;
            let tc = ts*t;
            return b+c*(tc + -3*ts + 3*t);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinButton.disabled = true;
            spinAngleStart = Math.random() * 10 + 20;
            spinTime = 0;
            spinTimeTotal = Math.random() * 2000 + 3000;
            rotateWheel();
        }

        function updateList() {
            itemsList.innerHTML = '';
            items.forEach((item, index) => {
                let row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `<span>${item}</span> <button class="delete-btn" onclick="removeItem(${index})">X</button>`;
                itemsList.appendChild(row);
            });
            localStorage.setItem('ruleta_caos_items', JSON.stringify(items));
            drawWheel();
        }

        window.removeItem = function(index) {
            if(items.length <= 2) {
                alert("¡Necesitas al menos 2 opciones!");
                return;
            }
            items.splice(index, 1);
            updateList();
        }

        addBtn.addEventListener('click', () => {
            let val = newItemText.value.trim();
            if(val) {
                items.push(val);
                newItemText.value = '';
                updateList();
            }
        });

        revealBtn.addEventListener('click', () => {
            trivialAnswer.style.display = "block";
            revealBtn.style.display = "none";
        });

        spinButton.addEventListener('click', spin);
        closeModal.addEventListener('click', () => resultModal.classList.remove('show'));

        drawWheel();
        updateList();
    </script>
</body>
</html>
