<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Ruleta del Caos - ChicaOhyeah</title>
    <style>
        :root {
            --bg-color: #0b0914;
            --panel-bg: #151124;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-lime: #39ff14;
            --neon-yellow: #fffe00;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }
        header { text-align: center; margin-bottom: 10px; }
        h1 {
            font-size: 1.4rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 243, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle { font-size: 0.8rem; color: #a5b4fc; margin-top: 2px; }
        
        /* Contenedor principal Lado a Lado */
        .main-layout {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .column-wheel {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 300px;
            max-width: 380px;
            gap: 12px;
        }

        .column-side {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-width: 300px;
            max-width: 380px;
        }
        
        /* Ruleta */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 5px auto;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid var(--neon-pink);
            z-index: 20;
            filter: drop-shadow(0 0 8px var(--neon-pink));
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-pink), inset 0 0 12px rgba(255, 255, 255, 0.3);
            border: 4px solid var(--neon-cyan);
        }
        
        /* Botón Gigante de Giro */
        .spin-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--neon-pink), #ff5e00);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--neon-pink);
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 1px;
        }
        .spin-btn:active { transform: scale(0.96); box-shadow: 0 0 8px var(--neon-pink); }

        /* Paneles */
        .panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 14px;
            padding: 12px;
            width: 100%;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.15);
        }
        .panel.yellow-border { border-color: var(--neon-yellow); box-shadow: 0 0 12px rgba(255, 254, 0, 0.15); }
        .panel h2 { font-size: 1rem; color: var(--neon-yellow); margin-bottom: 8px; text-align: center; }
        
        .input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background-color: #1f1a3a;
            color: white;
            font-size: 0.9rem;
        }
        .add-btn {
            padding: 0 14px;
            background-color: var(--neon-lime);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        /* Listas */
        .items-list, .players-list {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .item-row, .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
        }
        .player-name { font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
        .player-score { 
            background: var(--neon-pink); 
            color: white; 
            padding: 2px 6px; 
            border-radius: 10px; 
            font-weight: bold;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .player-controls {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .select-turn-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: bold;
        }
        .score-btn {
            background: #374151;
            color: white;
            border: 1px solid #6b7280;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .score-btn.plus { background: #166534; border-color: var(--neon-lime); color: var(--neon-lime); }
        .score-btn.minus { background: #991b1b; border-color: #ef4444; color: #fca5a5; }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        /* Banner de Turno Actual y Botón Siguiente */
        .turn-box {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border: 2px solid var(--neon-yellow);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 254, 0, 0.3);
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .turn-text { font-size: 0.95rem; font-weight: bold; color: #fff; }
        .turn-text span { color: var(--neon-yellow); text-transform: uppercase; }
        
        .next-turn-btn {
            background: var(--neon-yellow);
            color: #000;
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(255, 254, 0, 0.5);
        }

        /* Modales */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: linear-gradient(145deg, #1f1a3a, #110c22);
            border: 3px solid var(--neon-lime);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 0 30px var(--neon-lime);
            animation: popIn 0.3s ease;
        }
        .modal-content h3 { color: var(--neon-yellow); font-size: 1.2rem; margin-bottom: 4px; text-transform: uppercase; }
        .modal-content p { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        
        .custom-box {
            background: rgba(0,0,0,0.5);
            border: 2px dashed var(--neon-cyan);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
        }
        .box-category {
            font-size: 0.8rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .box-question { 
            color: var(--neon-cyan); 
            font-size: 1rem; 
            margin-bottom: 8px; 
            line-height: 1.3; 
            font-weight: bold;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .option-btn {
            background: #2a224a;
            color: white;
            border: 1px solid var(--neon-cyan);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-btn.correct { background: #15803d !important; border-color: var(--neon-lime) !important; color: white; }
        .option-btn.wrong { background: #b91c1c !important; border-color: #ef4444 !important; color: white; }

        .trivial-answer { 
            color: var(--neon-lime); 
            font-size: 0.95rem; 
            font-weight: bold; 
            display: none; 
            margin-top: 8px; 
            padding: 8px;
            background: rgba(57, 255, 20, 0.1);
            border-radius: 6px;
            border: 1px solid var(--neon-lime);
        }
        
        .btn-reveal {
            background: var(--neon-yellow);
            color: #000;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
        }

        .close-modal {
            background: var(--neon-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-pink);
            width: 100%;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>La Ruleta del Caos</h1>
        <div class="subtitle">ChicaOhyeah TikTok Live</div>
    </header>

    <div class="main-layout">
        <!-- Columna Izquierda: Ruleta y Botón -->
        <div class="column-wheel">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel" width="350" height="350"></canvas>
            </div>
            <button class="spin-btn" id="spinButton">¡Girar Ruleta!</button>
        </div>

        <!-- Columna Derecha: Tablero de Puntos, Control de Turnos y Gestor de Casillas -->
        <div class="column-side">
            <!-- Caja de Turno Manual -->
            <div class="turn-box">
                <div class="turn-text">🎮 Turno de: <span id="currentTurnPlayer">Nadie</span></div>
                <button class="next-turn-btn" id="nextTurnBtn">➡️ Siguiente Turno</button>
            </div>

            <!-- Panel Marcador de Jugadores -->
            <div class="panel yellow-border">
                <h2>🏆 Tablero de Puntos</h2>
                <div class="input-group">
                    <input type="text" id="newPlayerName" placeholder="Nombre de participante...">
                    <button class="add-btn" id="addPlayerBtn">Añadir</button>
                </div>
                <div class="players-list" id="playersList"></div>
            </div>

            <!-- Panel Configuración de Casillas -->
            <div class="panel">
                <h2>Personalizar Casillas</h2>
                <div class="input-group">
                    <input type="text" id="newItemText" placeholder="Añade opción o reto...">
                    <button class="add-btn" id="addBtn">Añadir</button>
                </div>
                <div class="items-list" id="itemsList"></div>
            </div>
        </div>
    </div>

    <!-- Modal Unificado -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h3 id="modalTitle">¡Resultado del Caos!</h3>
            <p id="resultText">Premio</p>

            <div class="custom-box" id="customBox" style="display: none;">
                <div class="box-category" id="boxCategory">CATEGORÍA</div>
                <div class="box-question" id="boxQuestion">Detalle del reto</div>
                <div class="options-grid" id="optionsGrid"></div>
                <button class="btn-reveal" id="revealBtn" style="display:none;">Ver Respuesta</button>
                <div class="trivial-answer" id="trivialAnswer">Respuesta correcta</div>
            </div>

            <button class="close-modal" id="closeModal">¡Entendido!</button>
        </div>
    </div>

    <script>
        const defaultItems = [
            "🧠 TRIVIAL", "➕ GANAS 1 PUNTO", "🤫 INCÓMODA", 
            "➖ PIERDES 1 PUNTO", "🃏 EL JOKER", "🔮 EL PÉNDULO", 
            "➕ GANAS 1 PUNTO", "🎁 REGALOS VIP"
        ];

        const defaultPlayers = [
            { name: "ChicaOhyeah", score: 0 }
        ];

        const preguntasTrivial = [
            { cat: "🎵 Música", q: "¿Quién canta la famosa canción 'Despacito'?", opts: ["Bad Bunny", "Luis Fonsi", "Daddy Yankee", "Rauw Alejandro"], correct: 1 },
            { cat: "🎵 Música", q: "¿De qué país es la cantante Rosalía?", opts: ["México", "Argentina", "España", "Colombia"], correct: 2 },
            { cat: "🎬 Cine & TV", q: "¿Cómo se llama el ogro verde de la película?", opts: ["Shrek", "Fiona", "Asno", "Lord Farquaad"], correct: 0 },
            { cat: "📱 Redes Social", q: "¿Qué red social tenía el icono de un pajarito azul?", opts: ["TikTok", "Instagram", "Twitter (X)", "Facebook"], correct: 2 },
            { cat: "🧠 Curiosidades", q: "¿Cuántos corazones tiene un pulpo?", opts: ["1 corazón", "2 corazones", "3 corazones", "4 corazones"], correct: 2 },
            { cat: "🍕 Gastronomía", q: "¿Cuál es el ingrediente principal del guacamole?", opts: ["Tomate", "Aguacate", "Pimiento", "Cebolla"], correct: 1 }
        ];

        const preguntasIncomodas = [
            "¿Cuál ha sido tu mayor ridículo en público?",
            "Si pudieras borrar un mensaje que mandaste por error, ¿a quién iba?",
            "¿Qué mentira piadosa dijiste la semana pasada?",
            "¿Cuál es el capricho más absurdo en el que te has gastado dinero?",
            "Si tu historial fuera público, ¿qué porcentaje de vergüenza tendrías?"
        ];

        const poderesJoker = [
            "¡Poder Absoluto! Elige a alguien del chat para que cumpla el próximo castigo.",
            "¡Doble Giro! Vuelve a girar la ruleta inmediatamente.",
            "¡El Chat Manda! Los espectadores deciden tu próximo reto por comentarios.",
            "¡Intercambio! Pásale el reto al último que envió un regalo."
        ];

        const respuestasPendulo = [
            "🔮 El Péndulo dice: ¡DEFINITIVAMENTE SÍ!",
            "🔮 El Péndulo dice: ¡NI DE COÑA (NO)!",
            "🔮 El Péndulo dice: El destino no está claro... Pregunta de nuevo.",
            "🔮 El Péndulo dice: Todo apunta a que SÍ con mucha suerte.",
            "🔮 El Péndulo dice: Hay malas energías... La respuesta es NO."
        ];

        const dinámicasRegalos = [
            "🎁 ¡RETO DE REGALOS! Si el chat envía 10 Rosas o 1 Regalo en 60s, ¡cumplo un reto extremo!",
            "🎁 ¡COFRE DEL TESORO! La persona que envíe el próximo regalo elige qué reto tengo que hacer.",
            "🎁 ¡SALUDOS VIP! Mando saludos especiales y sigo en directo a quien envíe el próximo regalo."
        ];

        let items = JSON.parse(localStorage.getItem('ruleta_caos_items')) || defaultItems;
        let players = JSON.parse(localStorage.getItem('ruleta_caos_players')) || defaultPlayers;
        let currentTurnIndex = 0; // Índice del jugador actual en la lista

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinButton = document.getElementById('spinButton');
        const itemsList = document.getElementById('itemsList');
        const newItemText = document.getElementById('newItemText');
        const addBtn = document.getElementById('addBtn');

        const playersList = document.getElementById('playersList');
        const newPlayerName = document.getElementById('newPlayerName');
        const addPlayerBtn = document.getElementById('addPlayerBtn');
        const currentTurnPlayer = document.getElementById('currentTurnPlayer');
        const nextTurnBtn = document.getElementById('nextTurnBtn');

        const resultModal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const modalTitle = document.getElementById('modalTitle');
        
        const customBox = document.getElementById('customBox');
        const boxCategory = document.getElementById('boxCategory');
        const boxQuestion = document.getElementById('boxQuestion');
        const optionsGrid = document.getElementById('optionsGrid');
        const trivialAnswer = document.getElementById('trivialAnswer');
        const revealBtn = document.getElementById('revealBtn');
        const closeModal = document.getElementById('closeModal');

        let startAngle = 0;
        let arc = Math.PI / (items.length / 2);
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        const colors = ['#ff007f', '#00f3ff', '#39ff14', '#fffe00', '#9333ea', '#ff5e00', '#3b82f6', '#ec4899'];

        function drawWheel() {
            if (!canvas.getContext) return;
            arc = Math.PI / (items.length / 2);
            ctx.clearRect(0, 0, 350, 350);

            let outsideRadius = 160;
            let textRadius = 110;
            let insideRadius = 25;

            for(let i = 0; i < items.length; i++) {
                let angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.arc(175, 175, outsideRadius, angle, angle + arc, false);
                ctx.arc(175, 175, insideRadius, angle + arc, angle, true);
                ctx.stroke();
                ctx.fill();

                ctx.save();
                ctx.shadowOffsetX = -1;
                ctx.shadowOffsetY = -1;
                ctx.shadowBlur = 2;
                ctx.shadowColor = "rgb(0,0,0)";
                ctx.fillStyle = "#000000";
                ctx.translate(175 + Math.cos(angle + arc / 2) * textRadius, 
                              175 + Math.sin(angle + arc / 2) * textRadius);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                let text = items[i];
                let maxLength = 14;
                if(text.length > maxLength) text = text.substring(0, maxLength) + '...';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(175, 175, insideRadius, 0, 2 * Math.PI, false);
            ctx.fillStyle = '#151124';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#00f3ff';
            ctx.stroke();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function getActivePlayerName() {
            if (players.length === 0) return "Nadie";
            if (currentTurnIndex >= players.length) currentTurnIndex = 0;
            return players[currentTurnIndex].name;
        }

        function stopRotateWheel() {
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            ctx.save();
            let winningText = items[index];
            let textUpper = winningText.toUpperCase();

            let activeName = getActivePlayerName();

            customBox.style.display = "none";
            optionsGrid.innerHTML = '';
            revealBtn.style.display = "none";
            trivialAnswer.style.display = "none";

            if (textUpper.includes("TRIVIAL") || winningText.includes("🧠")) {
                modalTitle.textContent = "🧠 ¡PREGUNTA TRIVIAL!";
                resultText.textContent = `Turno de: ${activeName}`;
                let randomQ = preguntasTrivial[Math.floor(Math.random() * preguntasTrivial.length)];
                boxCategory.textContent = randomQ.cat;
                boxQuestion.textContent = randomQ.q;
                trivialAnswer.textContent = "Correcta: " + randomQ.opts[randomQ.correct];
                revealBtn.textContent = "Ver Respuesta Correcta";
                revealBtn.style.display = "block";

                const letters = ["A", "B", "C", "D"];
                randomQ.opts.forEach((optText, optIdx) => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = `${letters[optIdx]}) ${optText}`;
                    btn.onclick = function() {
                        let allBtns = optionsGrid.querySelectorAll('.option-btn');
                        allBtns.forEach(b => b.disabled = true);
                        if(optIdx === randomQ.correct) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('wrong');
                            allBtns[randomQ.correct].classList.add('correct');
                        }
                    };
                    optionsGrid.appendChild(btn);
                });
                customBox.style.display = "block";

            } else if (textUpper.includes("PÉNDULO") || textUpper.includes("PENDULO") || winningText.includes("🔮")) {
                modalTitle.textContent = "🔮 ¡PREGÚNTALE AL PÉNDULO!";
                resultText.textContent = `Turno de: ${activeName}`;
                boxCategory.textContent = "✨ RITUAL MÍSTICO";
                boxQuestion.textContent = `¡${activeName}, formula en voz alta tu pregunta de SÍ o NO al Péndulo!`;
                
                let randomAnswer = respuestasPendulo[Math.floor(Math.random() * respuestasPendulo.length)];
                trivialAnswer.textContent = randomAnswer;
                revealBtn.textContent = "🔮 Consultar al Péndulo";
                revealBtn.style.display = "block";
                
                customBox.style.display = "block";

            } else if (textUpper.includes("GANAS") || textUpper.includes("SUMA")) {
                modalTitle.textContent = "🎉 ¡PUNTO EXTRA!";
                resultText.textContent = `¡${activeName} gana 1 punto!`;
                boxCategory.textContent = "⭐ RECOMPENSA";
                boxQuestion.textContent = "¡Súmale +1 punto en el tablero lateral!";
                customBox.style.display = "block";

            } else if (textUpper.includes("PIERDES") || textUpper.includes("RESTA")) {
                modalTitle.textContent = "💥 ¡PENALIZACIÓN!";
                resultText.textContent = `¡${activeName} pierde 1 punto!`;
                boxCategory.textContent = "⚠️ RESTA DE PUNTOS";
                boxQuestion.textContent = "¡Réstale -1 punto en el tablero lateral!";
                customBox.style.display = "block";

            } else if (textUpper.includes("INCÓMODA") || textUpper.includes("INCOMODA") || winningText.includes("🤫")) {
                modalTitle.textContent = "🤫 ¡ZONA DE SALSEO!";
                resultText.textContent = `Le toca confesar a: ${activeName}`;
                boxCategory.textContent = "🔥 PREGUNTA INCÓMODA";
                boxQuestion.textContent = preguntasIncomodas[Math.floor(Math.random() * preguntasIncomodas.length)];
                customBox.style.display = "block";

            } else if (textUpper.includes("JOKER") || winningText.includes("🃏")) {
                modalTitle.textContent = "🃏 ¡PODER DEL JOKER!";
                resultText.textContent = `Poder especial para: ${activeName}`;
                boxCategory.textContent = "⚡ COMODÍN";
                boxQuestion.textContent = poderesJoker[Math.floor(Math.random() * poderesJoker.length)];
                customBox.style.display = "block";

            } else if (textUpper.includes("REGALOS") || winningText.includes("🎁")) {
                modalTitle.textContent = "🎁 ¡EVENTO DE REGALOS VIP!";
                resultText.textContent = `¡Reto para ${activeName} y el chat!`;
                boxCategory.textContent = "👑 DINÁMICA DE REGALOS";
                boxQuestion.textContent = dinámicasRegalos[Math.floor(Math.random() * dinámicasRegalos.length)];
                customBox.style.display = "block";

            } else {
                modalTitle.textContent = "¡Resultado del Caos!";
                resultText.textContent = `${activeName}: ${winningText}`;
            }

            resultModal.classList.add('show');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            
            isSpinning = false;
            spinButton.disabled = false;
            ctx.restore();
        }

        function easeOut(t, b, c, d) {
            let ts = (t/=d)*t;
            let tc = ts*t;
            return b+c*(tc + -3*ts + 3*t);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinButton.disabled = true;
            spinAngleStart = Math.random() * 10 + 20;
            spinTime = 0;
            spinTimeTotal = Math.random() * 2000 + 3000;
            rotateWheel();
        }

        // --- Gestión de Casillas ---
        function updateList() {
            itemsList.innerHTML = '';
            items.forEach((item, index) => {
                let row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `<span>${item}</span> <button class="delete-btn" onclick="removeItem(${index})">X</button>`;
                itemsList.appendChild(row);
            });
            localStorage.setItem('ruleta_caos_items', JSON.stringify(items));
            drawWheel();
        }

        window.removeItem = function(index) {
            if(items.length <= 2) {
                alert("¡Necesitas al menos 2 opciones!");
                return;
            }
            items.splice(index, 1);
            updateList();
        }

        addBtn.addEventListener('click', () => {
            let val = newItemText.value.trim();
            if(val) {
                items.push(val);
                newItemText.value = '';
                updateList();
            }
        });

        // --- Gestión de Jugadores y Turnos Manuales ---
        function updatePlayersList() {
            playersList.innerHTML = '';
            if (players.length === 0) {
                playersList.innerHTML = '<div style="text-align:center; color:#9ca3af; font-size:0.8rem;">No hay jugadores. ¡Añade el primero!</div>';
                currentTurnPlayer.textContent = "Nadie";
            } else {
                if (currentTurnIndex >= players.length) currentTurnIndex = 0;
                currentTurnPlayer.textContent = players[currentTurnIndex].name;
            }

            players.forEach((player, index) => {
                let row = document.createElement('div');
                row.className = 'player-row';
                let isCurrent = (index === currentTurnIndex);
                row.style.border = isCurrent ? "1px solid var(--neon-yellow)" : "none";

                row.innerHTML = `
                    <div class="player-info">
                        <span class="player-name">${player.name}</span>
                        <span class="player-score">${player.score} pts</span>
                    </div>
                    <div class="player-controls">
                        <button class="select-turn-btn" onclick="setTurn(${index})" title="Pasar turno a este jugador">🎯</button>
                        <button class="score-btn plus" onclick="changeScore(${index}, 1)">+1</button>
                        <button class="score-btn minus" onclick="changeScore(${index}, -1)">-1</button>
                        <button class="delete-btn" onclick="removePlayer(${index})">🗑️</button>
                    </div>
                `;
                playersList.appendChild(row);
            });
            localStorage.setItem('ruleta_caos_players', JSON.stringify(players));
        }

        window.setTurn = function(index) {
            currentTurnIndex = index;
            updatePlayersList();
        };

        nextTurnBtn.addEventListener('click', () => {
            if (players.length > 0) {
                currentTurnIndex = (currentTurnIndex + 1) % players.length;
                updatePlayersList();
            }
        });

        window.changeScore = function(index, delta) {
            players[index].score += delta;
            updatePlayersList();
        };

        window.removePlayer = function(index) {
            players.splice(index, 1);
            if (currentTurnIndex >= players.length) currentTurnIndex = Math.max(0, players.length - 1);
            updatePlayersList();
        };

        addPlayerBtn.addEventListener('click', () => {
            let nameVal = newPlayerName.value.trim();
            if(nameVal) {
                players.push({ name: nameVal, score: 0 });
                newPlayerName.value = '';
                updatePlayersList();
            }
        });

        revealBtn.addEventListener('click', () => {
            trivialAnswer.style.display = "block";
            revealBtn.style.display = "none";
        });

        spinButton.addEventListener('click', spin);
        closeModal.addEventListener('click', () => resultModal.classList.remove('show'));

        drawWheel();
        updateList();
        updatePlayersList();
    </script>
</body>
</html>
