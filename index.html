    <!-- JAVASCRIPT LÓGICA DE LA RULETA -->
    <script>
        // 1. LISTA DE ELEMENTOS PREDETERMINADOS (Guardados en LocalStorage)
        const DEFAULT_ITEMS = [
            "💃 Baila 15 seg",
            "🎤 Dueto Cantado",
            "🔥 20 Flexiones",
            "🤪 Caras Feas x3",
            "🌶️ Cucharada Picosa",
            "👑 Regala Mod",
            "❓ Pregunta Incómoda",
            "🎁 Saludo Especial"
        ];

        // COLORES NEÓN PARA CASILLAS
        const NEON_COLORS = [
            "#ff007f", // Fucsia
            "#00f3ff", // Cian
            "#39ff14", // Verde Lima
            "#ffe600", // Amarillo
            "#b026ff", // Púrpura
            "#ff5e00"  // Naranja
        ];

        let items = JSON.parse(localStorage.getItem('ruleta_caos_items')) || [...DEFAULT_ITEMS];
        let audioEnabled = true;

        // ESTADO DE LA RULETA
        let canvas = document.getElementById('wheelCanvas');
        let ctx = canvas.getContext('2d');
        let startAngle = 0;
        let arc = Math.PI / (items.length / 2);
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;
        let lastTickSegment = -1;

        // WEB AUDIO API PARA EFECTOS SONOROS
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sonido Sintetizado: Ticks de la ruleta
        function playTickSound() {
            if (!audioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        // Sonido Sintetizado: Fanfarria de victoria
        function playWinSound() {
            if (!audioEnabled) return;
            try {
                initAudio();
                const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, High C
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    
                    const startTime = audioCtx.currentTime + (index * 0.1);
                    gain.gain.setValueAtTime(0.3, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            } catch(e) {}
        }

        // AJUSTAR TAMAÑO Y DIBUJAR RULETA
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = container.clientWidth - 16;
            canvas.width = size * window.devicePixelRatio;
            canvas.height = size * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            drawWheel();
        }

        function drawWheel() {
            if (!canvas.getContext) return;
            const size = canvas.width / window.devicePixelRatio;
            const outsideRadius = size / 2 - 10;
            const textRadius = outsideRadius * 0.68;
            const insideRadius = 35;

            ctx.clearRect(0, 0, size, size);
            arc = (2 * Math.PI) / items.length;

            const centerX = size / 2;
            const centerY = size / 2;

            for (let i = 0; i < items.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = NEON_COLORS[i % NEON_COLORS.length];

                // Dibujar Quesito / Sector
                ctx.beginPath();
                ctx.arc(centerX, centerY, outsideRadius, angle, angle + arc, false);
                ctx.arc(centerX, centerY, insideRadius, angle + arc, angle, true);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#090813';
                ctx.stroke();

                // Dibujar Texto
                ctx.save();
                ctx.fillStyle = '#090813';
                ctx.font = 'bold 14px Outfit, sans-serif';
                ctx.translate(
                    centerX + Math.cos(angle + arc / 2) * textRadius,
                    centerY + Math.sin(angle + arc / 2) * textRadius
                );
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                
                const text = items[i];
                const truncatedText = text.length > 16 ? text.substring(0, 14) + '..' : text;
                ctx.fillText(truncatedText, -ctx.measureText(truncatedText).width / 2, 0);
                ctx.restore();
            }
        }

        // LÓGICA DE GIRO
        function spinWheel() {
            if (isSpinning || items.length === 0) return;

            // Trigger audio context on tap
            initAudio();

            // Vibración en Android al pulsar
            if (navigator.vibrate) navigator.vibrate(50);

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('spinBtn').classList.add('opacity-50', 'scale-95');

            spinAngleStart = Math.random() * 10 + 20;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000; // 4 a 7 segundos de giro
            lastTickSegment = -1;

            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 20;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }

            // Desaceleración suave (Ease-Out)
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI) / 180;
            drawWheel();

            // Calcular en qué segmento estamos para el sonido de TICK
            const degrees = (startAngle * 180) / Math.PI + 90;
            const arcd = (arc * 180) / Math.PI;
            const currentSegment = Math.floor((360 - (degrees % 360)) / arcd);
            
            if (currentSegment !== lastTickSegment) {
                playTickSound();
                if (navigator.vibrate) navigator.vibrate(15); // Pequeña vibración por cada tick
                lastTickSegment = currentSegment;
            }

            spinTimeout = requestAnimationFrame(rotateWheel);
        }

        function stopRotateWheel() {
            cancelAnimationFrame(spinTimeout);
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('spinBtn').classList.remove('opacity-50', 'scale-95');

            // Calcular Ganador (Arriba - Puntero a 270 grados / Math.PI * 1.5)
            const degrees = (startAngle * 180) / Math.PI + 90;
            const arcd = (arc * 180) / Math.PI;
            const index = Math.floor((360 - (degrees % 360)) / arcd) % items.length;
            const winningItem = items[index];

            // Vibración final más fuerte
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            // Efecto Sonoro Ganador y Modal
            playWinSound();
            showResult(winningItem);
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        // MOSTRAR Y CERRAR RESULTADOS
        function showResult(text) {
            document.getElementById('resultText').innerText = text;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        // PANEL DE EDICIÓN Y GESTIÓN DE ITEMS
        function renderItemsList() {
            const container = document.getElementById('itemsList');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2 bg-darkBg p-2.5 rounded-xl border border-gray-800';
                div.innerHTML = `
                    <span class="w-3 h-3 rounded-full" style="background-color: ${NEON_COLORS[index % NEON_COLORS.length]}"></span>
                    <input type="text" value="${item}" onchange="updateItem(${index}, this.value)" class="flex-1 bg-transparent text-white focus:outline-none text-sm font-medium">
                    <button onclick="removeItem(${index})" class="text-red-500 font-bold px-2 py-1 text-base active:scale-110">✕</button>
                `;
                container.appendChild(div);
            });
        }

        function addItem() {
            const input = document.getElementById('newItemInput');
            const val = input.value.trim();
            if (val) {
                items.push(val);
                input.value = '';
                saveAndRefresh();
            }
        }

        function updateItem(index, newValue) {
            if (newValue.trim()) {
                items[index] = newValue.trim();
                saveAndRefresh();
            }
        }

        function removeItem(index) {
            if (items.length <= 2) {
                alert("¡Debe haber al menos 2 opciones en la ruleta!");
                return;
            }
            items.splice(index, 1);
            saveAndRefresh();
        }

        function resetDefaultItems() {
            items = [...DEFAULT_ITEMS];
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('ruleta_caos_items', JSON.stringify(items));
            renderItemsList();
            drawWheel();
        }

        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                renderItemsList();
            }
        }

        function toggleAudioSetting() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audioToggleBtn');
            btn.innerHTML = audioEnabled ? '<span>🔊</span> SONIDO: ON' : '<span>🔇</span> SONIDO: OFF';
            btn.classList.toggle('text-neonLime', audioEnabled);
            btn.classList.toggle('text-gray-500', !audioEnabled);
        }

        // INICIALIZACIÓN
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
